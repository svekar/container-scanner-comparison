# Grype (Anchore): open source, no account needed.
# https://github.com/anchore/scan-action
name: Scan · Grype

on:
  workflow_call:
    inputs:
      image:
        description: Image to scan
        type: string
        default: bkimminich/juice-shop:v20.3.0
  workflow_dispatch:
    inputs:
      image:
        description: Image to scan
        type: string
        default: bkimminich/juice-shop:v20.3.0

permissions:
  contents: read

jobs:
  grype:
    name: Grype
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.image }}
      OUT: scan-grype
    steps:
      - name: Prepare output directory
        run: mkdir -p "$OUT"

      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ inputs.image }}
          output-format: json
          output-file: scan-grype/grype.json
          fail-build: false # report only; gating happens in the aggregate job
          # The action defaults to an older Grype; pin the latest release explicitly.
          grype-version: v0.121.0

      - name: Write metadata and summary
        if: ${{ !cancelled() }}
        run: |
          status=failed
          [[ -s $OUT/grype.json ]] && status=ok
          version=$(jq -r '.descriptor.version // ""' "$OUT/grype.json" 2>/dev/null || true)
          jq -n --arg status "$status" --arg version "$version" --arg image "$IMAGE" \
            '$ARGS.named' > "$OUT/meta.json"
          {
            echo "### Grype $version: \`$IMAGE\` ($status)"
            echo
            echo "| Severity | Findings |"
            echo "|---|---:|"
            jq -r '[.matches[]?.vulnerability] | group_by(.severity)[]
                   | "| \(.[0].severity) | \(length) |"' "$OUT/grype.json" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-grype
          path: scan-grype/
          retention-days: 14
