version: 2
updates:
  # Keeps the SHA-pinned actions (and their version comments) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting a new release, so a hijacked or broken tag has
    # time to be noticed and pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
